</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6b7280"/></marker><marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1f2430"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1a7f37"/></marker><marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#c4321c"/></marker><marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2457d6"/></marker><marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6d3fd1"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="130%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1f2430" flood-opacity=".12"/></filter></defs><rect x="0.5" y="0.5" width="1099" height="469" rx="16" fill="#ffffff" stroke="#e5e7eb"/><rect x="30" y="24" width="1040" height="40" rx="10" fill="#fff4d6" stroke="#b7791f"/><text x="550" y="50" class="b c tA">MVP · a first step toward a working registry, not the final hosting location</text><path d="M210,160 L258,160" class="ln" marker-end="url(#a)"/><text x="234" y="150" class="s c">tag</text><path d="M490,140 L558,130" class="lnB" marker-end="url(#aB)"/><text x="522" y="122" class="s c tB">push</text><path d="M490,180 L558,255" class="lnP" marker-end="url(#aP)"/><text x="516" y="238" class="s e tP">sign</text><path d="M760,130 L828,178" class="lnB" marker-end="url(#aB)"/><text x="800" y="140" class="s tB">pull</text><path d="M760,260 L828,212" class="lnP" marker-end="url(#aP)"/><text x="800" y="258" class="s tP">verify</text><path d="M945,330 L945,242" class="ln dash" marker-end="url(#a)"/><text x="955" y="292" class="s">alternative pull</text><rect x="30" y="120" width="180" height="80" rx="10" class="box neu" filter="url(#sh)"/><text x="120" y="156.2" class="b c ">Spec repository</text><text x="120" y="175.1" class="s c ">GitHub · PR review</text><rect x="260" y="110" width="230" height="100" rx="10" class="box gate" filter="url(#sh)"/><text x="375" y="147.1" class="b c ">Release workflow</text><text x="375" y="166.0" class="s c ">GitHub Actions</text><text x="375" y="184.2" class="s c ">validate · suite · package</text><rect x="560" y="90" width="200" height="80" rx="10" class="box spec" filter="url(#sh)"/><text x="660" y="125.8" class="m c ">ghcr.io</text><text x="660" y="144.3" class="s c ">OCI artifact by digest</text><rect x="560" y="220" width="200" height="80" rx="10" class="box q" filter="url(#sh)"/><text x="660" y="256.1" class="b c ">Sigstore</text><text x="660" y="275.1" class="s c ">Fulcio cert · Rekor log</text><rect x="830" y="150" width="230" height="90" rx="10" class="box dark" filter="url(#sh)"/><text x="945" y="182.1" class="b c w">specbase client</text><text x="945" y="201.0" class="s c w">checks digest, signing</text><text x="945" y="219.2" class="s c w">identity and log entry</text><rect x="830" y="330" width="230" height="70" rx="10" class="box neu" filter="url(#sh)" stroke-dasharray="6 4"/><text x="945" y="361.1" class="b c ">Company mirror</text><text x="945" y="380.1" class="s c ">replicates ghcr.io (§5.5)</text><rect x="30" y="330" width="520" height="116" rx="10" fill="#f2faf4" stroke="#bfe3c9"/><text x="50" y="360" class="b tG">Trust does not live in the host</text><text x="50" y="386" class="s">GitHub and ghcr.io only store and deliver packages. Trust comes</text><text x="50" y="406" class="s">from the digest, the signing identity and the transparency log.</text><text x="50" y="426" class="s">A compromised host can withhold packages, but cannot forge them.</text></svg>
