</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6b7280"/></marker><marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1f2430"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1a7f37"/></marker><marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#c4321c"/></marker><marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2457d6"/></marker><marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6d3fd1"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="130%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1f2430" flood-opacity=".12"/></filter></defs><rect x="0.5" y="0.5" width="1099" height="554" rx="16" fill="#ffffff" stroke="#e5e7eb"/><text x="30" y="44" class="h">Distribution with a company mirror</text><text x="30" y="68" class="s">Only specifications cross the organization boundary. Generated code never leaves it.</text><rect x="480" y="90" width="600" height="445" rx="14" fill="#f6f7f9" stroke="#9ca3af"/><text x="500" y="118" class="b tN">Organization scope</text><path d="M220,175 L258,175" class="lnB" marker-end="url(#aB)"/><path d="M440,175 L508,175" class="lnB" marker-end="url(#aB)"/><path d="M680,175 L728,175" class="ln" marker-end="url(#a)"/><path d="M890,210 L890,253" class="lnG" marker-end="url(#aG)"/><path d="M790,340 L567,428" class="lnG" marker-end="url(#aG)"/><path d="M790,340 L707,428" class="lnG" marker-end="url(#aG)"/><path d="M790,340 L847,428" class="lnG" marker-end="url(#aG)"/><path d="M790,340 L987,428" class="lnG" marker-end="url(#aG)"/><rect x="30" y="140" width="190" height="70" rx="10" class="box spec" filter="url(#sh)"/><text x="125" y="171.2" class="b c ">Public spec registry</text><text x="125" y="190.1" class="s c ">signed spec packages</text><rect x="260" y="140" width="180" height="70" rx="10" class="box gate" filter="url(#sh)"/><text x="350" y="171.2" class="b c ">Review + quarantine</text><text x="350" y="190.1" class="s c ">approval · delay</text><rect x="510" y="140" width="170" height="70" rx="10" class="box spec" filter="url(#sh)"/><text x="595" y="171.2" class="b c ">Spec mirror</text><text x="595" y="190.1" class="s c ">approved specs only</text><rect x="730" y="140" width="320" height="70" rx="10" class="box agent" filter="url(#sh)"/><text x="890" y="171.2" class="b c ">Synthesis + gates</text><text x="890" y="190.1" class="s c ">once per standard profile</text><rect x="640" y="255" width="300" height="85" rx="10" class="box ok" filter="url(#sh)"/><text x="790" y="284.6" class="b c ">Synthesis registry</text><text x="790" y="303.5" class="s c ">signed implementations</text><text x="790" y="321.7" class="s c ">key: spec · profile · language · toolchain</text><text x="625" y="282" class="s b e tG">verified on use:</text><text x="625" y="300" class="s e">signature, digests,</text><text x="625" y="318" class="s e">local suite run</text><rect x="505" y="430" width="125" height="65" rx="10" class="box neu" filter="url(#sh)"/><text x="567.5" y="458.6" class="b c ">Service A</text><text x="567.5" y="477.6" class="s c ">internal-service</text><rect x="645" y="430" width="125" height="65" rx="10" class="box neu" filter="url(#sh)"/><text x="707.5" y="458.6" class="b c ">Service B</text><text x="707.5" y="477.6" class="s c ">internal-service</text><rect x="785" y="430" width="125" height="65" rx="10" class="box neu" filter="url(#sh)"/><text x="847.5" y="458.6" class="b c ">Gateway</text><text x="847.5" y="477.6" class="s c ">external-api</text><rect x="925" y="430" width="125" height="65" rx="10" class="box q" filter="url(#sh)" stroke-dasharray="6 4"/><text x="987.5" y="458.6" class="b c ">Service D</text><text x="987.5" y="477.6" class="s c ">own profile</text><path d="M512,503 v8 H760 v-8" fill="none" stroke="#6b7280" stroke-width="1.4"/><text x="636" y="527" class="s c">same profile → same synthesis</text><rect x="30" y="260" width="410" height="170" rx="10" fill="#fafafa" stroke="#9ca3af" stroke-dasharray="6 4"/><text x="50" y="292" class="b">Why a company mirror</text><circle cx="56" cy="317" r="3.5" fill="#2457d6"/><text x="68" y="322" class="s">Review gate for new spec versions</text><circle cx="56" cy="343" r="3.5" fill="#2457d6"/><text x="68" y="348" class="s">Quarantine catches poisoned releases</text><circle cx="56" cy="369" r="3.5" fill="#2457d6"/><text x="68" y="374" class="s">Air-gapped builds, no external outages</text><circle cx="56" cy="395" r="3.5" fill="#2457d6"/><text x="68" y="400" class="s">Blast radius limited to one organization</text></svg>
