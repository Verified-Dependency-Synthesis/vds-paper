45" class="h e tG">VDS sweet spot</text><circle cx="185" cy="130" r="7" fill="#2457d6" stroke="#fff" stroke-width="2"/><text x="198" y="135" class="ms">Crypto primitives</text><circle cx="305" cy="180" r="7" fill="#2457d6" stroke="#fff" stroke-width="2"/><text x="318" y="185" class="ms">TLS core</text><circle cx="215" cy="250" r="7" fill="#2457d6" stroke="#fff" stroke-width="2"/><text x="228" y="255" class="ms">Compression</text><circle cx="710" cy="250" r="7" fill="#6d3fd1" stroke="#fff" stroke-width="2"/><text x="723" y="255" class="ms">Protocol adapter</text><circle cx="605" cy="350" r="7" fill="#1a7f37" stroke="#fff" stroke-width="2"/><text x="618" y="355" class="ms">HTTP client</text><circle cx="680" cy="380" r="7" fill="#1a7f37" stroke="#fff" stroke-width="2"/><text x="693" y="385" class="ms">Format parser</text><circle cx="545" cy="420" r="7" fill="#1a7f37" stroke="#fff" stroke-width="2"/><text x="558" y="425" class="ms">Serialization</text><circle cx="755" cy="460" r="7" fill="#1a7f37" stroke="#fff" stroke-width="2"/><text x="768" y="465" class="ms">Config loader</text><circle cx="635" cy="500" r="7" fill="#1a7f37" stroke="#fff" stroke-width="2"/><text x="648" y="505" class="ms">Retry logic</text><circle cx="335" cy="500" r="7" fill="#6b7280" stroke="#fff" stroke-width="2"/><text x="348" y="505" class="ms">left-pad</text><text x="485" y="592" class="b c">Project specificity →</text><text x="110" y="592" class="s">low</text><text x="860" y="592" class="s e">high</text><text transform="translate(66,310) rotate(-90)" class="b c">Verification cost →</text><text transform="translate(92,560) rotate(-90)" class="s">cheap, automated</text><text transform="translate(92,60) rotate(-90)" class="s e">expensive to prove</text></svg>
