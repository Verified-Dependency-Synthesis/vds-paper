face</text><rect x="40" y="288" width="290" height="60" rx="10" class="box spec" filter="url(#sh)"/><text x="56" y="313" class="m">invariants.yaml</text><text x="56" y="333" class="s">Security and resource invariants</text><rect x="40" y="358" width="290" height="60" rx="10" class="box spec" filter="url(#sh)"/><text x="56" y="383" class="m">profile.schema.json</text><text x="56" y="403" class="s">Constraints a profile may set</text><rect x="40" y="428" width="290" height="60" rx="10" class="box spec" filter="url(#sh)"/><text x="56" y="453" class="m">threat-model.md</text><text x="56" y="473" class="s">Attack classes, assumptions, scope</text><rect x="357" y="104" width="290" height="32" rx="8" fill="#6d3fd1"/><text x="371" y="125" class="b w">Conformance suite</text><rect x="357" y="148" width="290" height="60" rx="10" class="box gate" filter="url(#sh)"/><text x="373" y="173" class="m">suite.yaml</text><text x="373" y="193" class="s">Harness version and defaults</text><rect x="357" y="218" width="290" height="60" rx="10" class="box gate" filter="url(#sh)"/><text x="373" y="243" class="m">vectors/</text><text x="373" y="263" class="s">Input → expected behavior</text><rect x="357" y="288" width="290" height="60" rx="10" class="box gate" filter="url(#sh)"/><text x="373" y="313" class="m">properties/</text><text x="373" y="333" class="s">Language-neutral properties</text><rect x="357" y="358" width="290" height="60" rx="10" class="box gate" filter="url(#sh)"/><text x="373" y="383" class="m">fuzz/</text><text x="373" y="403" class="s">Fuzz targets, seed corpus, duration</text><rect x="357" y="428" width="290" height="60" rx="10" class="box gate" filter="url(#sh)"/><text x="373" y="453" class="m">adversarial/</text><text x="373" y="473" class="s">Known attack classes</text><rect x="674" y="104" width="290" height="32" rx="8" fill="#1a7f37"/><text x="688" y="125" class="b w">Manifest and optional parts</text><rect x="674" y="148" width="290" height="60" rx="10" class="box 